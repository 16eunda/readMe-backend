spring:
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?sslmode=require
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:4}
      minimum-idle: ${DATABASE_MIN_IDLE:1}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 900000

  profiles:
    active: dev

  # H2 는 테스트 전용이다. devtools 가 켜진 실행(bootRun)에서도 콘솔(/h2-console)이 열리지 않게 명시적으로 끈다.
  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    # 운영에서 모든 SQL 을 표준 출력으로 찍으면 로그가 빠르게 쌓이고 느려진다. 로컬에서 보려면 .env 에 JPA_SHOW_SQL=true
    show-sql: ${JPA_SHOW_SQL:false}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}

server:
  port: ${PORT:8080}

gemini:
  api:
    key: ${GEMINI_API_KEY}       #key: ${GEMINI_API_KEY}  # 이건 환경 변수에서 가져오라는 뜻
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent

jwt:
  secret: ${JWT_SECRET}  # JWT_SECRET

google:
  play:
    package-name: ${GOOGLE_PLAY_PACKAGE_NAME:com.readme.app}
    webhook-token: ${GOOGLE_PLAY_WEBHOOK_TOKEN:}
    sync-cron: ${GOOGLE_PLAY_SYNC_CRON:0 15 3 * * *}
